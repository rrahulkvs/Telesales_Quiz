<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Righteous&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --surface2: #1a1a35;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0ff;
    --muted: rgba(240,240,255,0.5);
    --accent1: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f59e0b;
    --accent4: #10b981;
    --danger: #ef4444;
    --glow1: rgba(124,58,237,0.4);
    --glow2: rgba(6,182,212,0.4);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* PARTICLES BG */
  #particles-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  /* LANDING */
  #landing {
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'Righteous', cursive;
    font-size: clamp(2.5rem, 8vw, 5rem);
    background: linear-gradient(135deg, #7c3aed, #06b6d4, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    line-height: 1;
    margin-bottom: 0.5rem;
    filter: drop-shadow(0 0 30px rgba(124,58,237,0.6));
    animation: logoPulse 3s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%,100% { filter: drop-shadow(0 0 20px rgba(124,58,237,0.6)); }
    50% { filter: drop-shadow(0 0 40px rgba(6,182,212,0.8)); }
  }

  .tagline {
    color: var(--muted);
    font-size: 1.1rem;
    text-align: center;
    margin-bottom: 3rem;
    font-weight: 600;
  }

  .glass-card {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 0.875rem 1.25rem;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    outline: none;
    transition: all 0.2s;
    margin-bottom: 0.75rem;
  }

  input[type="text"]:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(6,182,212,0.2);
    background: rgba(6,182,212,0.05);
  }

  input[type="text"]::placeholder { color: rgba(255,255,255,0.2); letter-spacing: 0.05em; text-transform: none; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    width: 100%; padding: 0.9rem 1.5rem;
    border: none; border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
    text-decoration: none;
    letter-spacing: 0.02em;
    position: relative; overflow: hidden;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    color: white;
    box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    margin-bottom: 0.75rem;
  }

  .btn-primary:hover { box-shadow: 0 6px 30px rgba(124,58,237,0.6); transform: translateY(-1px); }

  .btn-secondary {
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: white;
    box-shadow: 0 4px 20px rgba(6,182,212,0.3);
    margin-bottom: 0.75rem;
  }

  .btn-secondary:hover { box-shadow: 0 6px 30px rgba(6,182,212,0.5); transform: translateY(-1px); }

  .btn-ghost {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { background: rgba(255,255,255,0.1); }

  .divider {
    display: flex; align-items: center; gap: 1rem;
    color: var(--muted); font-size: 0.85rem; margin: 1rem 0;
  }

  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  /* LOBBY */
  #lobby { padding: 1.5rem; align-items: center; position: relative; z-index: 1; }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 600px; margin-bottom: 1.5rem;
  }

  .room-code-display {
    font-family: 'Righteous', cursive;
    font-size: 2.5rem;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(245,158,11,0.5));
    letter-spacing: 0.1em;
  }

  .player-count {
    background: rgba(124,58,237,0.2);
    border: 1px solid rgba(124,58,237,0.4);
    border-radius: 100px;
    padding: 0.4rem 1rem;
    font-size: 0.9rem; font-weight: 700;
    color: #a78bfa;
  }

  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.75rem;
    width: 100%; max-width: 600px;
    margin-bottom: 1.5rem;
  }

  .player-chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 0.5rem;
    text-align: center;
    animation: playerJoin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes playerJoin {
    from { opacity: 0; transform: scale(0.5) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .player-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; margin: 0 auto 0.4rem;
  }

  .player-name-chip { font-size: 0.8rem; font-weight: 700; color: var(--text); }

  /* GAME SCREEN */
  #game { padding: 1.5rem; align-items: center; position: relative; z-index: 1; }

  .game-header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 700px; margin-bottom: 1.5rem;
  }

  .question-counter {
    font-size: 0.85rem; font-weight: 800; color: var(--muted);
    letter-spacing: 0.05em;
  }

  .score-display {
    background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(239,68,68,0.1));
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 100px;
    padding: 0.4rem 1.2rem;
    font-weight: 800; font-size: 1rem;
    color: #fbbf24;
  }

  .timer-ring {
    position: relative; width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
  }

  .timer-svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }

  .timer-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 6; }

  .timer-fill {
    fill: none; stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 220;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }

  .timer-num {
    font-family: 'Righteous', cursive;
    font-size: 1.8rem;
    color: var(--text);
    position: relative; z-index: 1;
  }

  .question-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    width: 100%; max-width: 700px;
    margin-bottom: 1.5rem;
    text-align: center;
    min-height: 120px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: questionReveal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes questionReveal {
    from { opacity: 0; transform: scale(0.9) translateY(-10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .question-text {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    width: 100%; max-width: 700px;
  }

  .answer-btn {
    padding: 1.25rem 1rem;
    border: none; border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    color: white;
    text-align: left;
    display: flex; align-items: center; gap: 0.75rem;
    position: relative; overflow: hidden;
    animation: answerReveal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  .answer-btn:nth-child(1) { animation-delay: 0.05s; }
  .answer-btn:nth-child(2) { animation-delay: 0.1s; }
  .answer-btn:nth-child(3) { animation-delay: 0.15s; }
  .answer-btn:nth-child(4) { animation-delay: 0.2s; }

  @keyframes answerReveal {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .answer-btn:not(:disabled):hover { transform: scale(1.03) translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .answer-btn:not(:disabled):active { transform: scale(0.98); }
  .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; transform: none !important; }

  .answer-btn.a { background: linear-gradient(135deg, #7c3aed, #5b21b6); box-shadow: 0 4px 20px rgba(124,58,237,0.3); }
  .answer-btn.b { background: linear-gradient(135deg, #0891b2, #0e7490); box-shadow: 0 4px 20px rgba(6,182,212,0.3); }
  .answer-btn.c { background: linear-gradient(135deg, #d97706, #b45309); box-shadow: 0 4px 20px rgba(245,158,11,0.3); }
  .answer-btn.d { background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 4px 20px rgba(239,68,68,0.3); }

  .answer-btn.correct { background: linear-gradient(135deg, #059669, #047857) !important; animation: correctPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 30px rgba(16,185,129,0.6) !important; }
  .answer-btn.wrong { background: rgba(239,68,68,0.15) !important; border: 1px solid rgba(239,68,68,0.3); opacity: 0.5; }

  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .answer-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 800; flex-shrink: 0;
  }

  .streak-badge {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    border-radius: 20px; padding: 1rem 2rem;
    font-family: 'Righteous', cursive;
    font-size: 2rem; color: white;
    z-index: 1000;
    animation: streakPop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    pointer-events: none;
    box-shadow: 0 0 50px rgba(245,158,11,0.6);
  }

  @keyframes streakPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    25% { transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; transform: translate(-50%, -70%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -90%) scale(0.8); }
  }

  .score-popup {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Righteous', cursive;
    font-size: 3rem; color: #10b981;
    z-index: 1000;
    animation: scoreFloat 1.2s ease-out forwards;
    pointer-events: none;
    text-shadow: 0 0 30px rgba(16,185,129,0.8);
  }

  @keyframes scoreFloat {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, -60%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
  }

  /* LEADERBOARD */
  #leaderboard { padding: 1.5rem; align-items: center; position: relative; z-index: 1; }

  .lb-title {
    font-family: 'Righteous', cursive;
    font-size: 1.8rem; text-align: center;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1.5rem;
  }

  .lb-list { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 0.6rem; }

  .lb-row {
    display: flex; align-items: center; gap: 1rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.875rem 1rem;
    animation: lbSlide 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    transition: transform 0.3s, background 0.3s;
  }

  .lb-row.me { background: rgba(124,58,237,0.15); border-color: rgba(124,58,237,0.4); }
  .lb-row.rank-1 { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); }
  .lb-row.rank-2 { background: rgba(148,163,184,0.08); border-color: rgba(148,163,184,0.2); }
  .lb-row.rank-3 { background: rgba(180,83,9,0.08); border-color: rgba(180,83,9,0.2); }

  @keyframes lbSlide {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .lb-rank {
    font-family: 'Righteous', cursive;
    font-size: 1.2rem;
    width: 32px; text-align: center;
    flex-shrink: 0;
  }

  .lb-score {
    margin-left: auto;
    font-weight: 800; font-size: 1.1rem;
    color: #fbbf24;
  }

  .lb-streak {
    font-size: 0.75rem;
    color: #f59e0b;
    background: rgba(245,158,11,0.15);
    border-radius: 100px;
    padding: 0.15rem 0.5rem;
    font-weight: 700;
  }

  /* PODIUM */
  #podium-screen { padding: 2rem; align-items: center; justify-content: center; position: relative; z-index: 1; }

  .podium-title {
    font-family: 'Righteous', cursive;
    font-size: clamp(2rem, 6vw, 3.5rem);
    text-align: center;
    background: linear-gradient(135deg, #f59e0b, #ef4444, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    animation: titleShimmer 2s ease-in-out infinite;
  }

  @keyframes titleShimmer {
    0%,100% { filter: drop-shadow(0 0 15px rgba(245,158,11,0.5)); }
    50% { filter: drop-shadow(0 0 30px rgba(239,68,68,0.7)); }
  }

  .podium-container {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 1rem; margin: 2rem 0;
  }

  .podium-place {
    display: flex; flex-direction: column; align-items: center;
    animation: podiumRise 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  .podium-place.p1 { animation-delay: 0.3s; }
  .podium-place.p2 { animation-delay: 0.1s; }
  .podium-place.p3 { animation-delay: 0.5s; }

  @keyframes podiumRise {
    from { opacity: 0; transform: translateY(60px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .podium-avatar-big {
    font-size: 3rem; margin-bottom: 0.5rem;
    animation: bounce 2s ease-in-out infinite;
  }

  .p1 .podium-avatar-big { animation-delay: 0s; }
  .p2 .podium-avatar-big { animation-delay: 0.3s; }
  .p3 .podium-avatar-big { animation-delay: 0.6s; }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .podium-player-name {
    font-weight: 800; font-size: 0.9rem;
    text-align: center; margin-bottom: 0.4rem;
    max-width: 100px;
  }

  .podium-player-score {
    font-family: 'Righteous', cursive;
    font-size: 1.1rem;
    color: #fbbf24; margin-bottom: 0.75rem;
  }

  .podium-block {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 12px 12px 0 0;
    width: 100px;
    font-family: 'Righteous', cursive;
    font-size: 1.8rem;
    color: white;
  }

  .p1 .podium-block { height: 130px; background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 -10px 40px rgba(245,158,11,0.5); }
  .p2 .podium-block { height: 95px; background: linear-gradient(135deg, #94a3b8, #64748b); }
  .p3 .podium-block { height: 70px; background: linear-gradient(135deg, #b45309, #92400e); }

  .crown { font-size: 2rem; animation: crownFloat 2s ease-in-out infinite; }
  @keyframes crownFloat {
    0%,100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-6px) rotate(10deg); }
  }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    top: -10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* QUIZ BUILDER */
  #builder { padding: 1.5rem; align-items: center; position: relative; z-index: 1; }

  .builder-header {
    width: 100%; max-width: 700px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .builder-title {
    font-family: 'Righteous', cursive;
    font-size: 1.5rem;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .question-list { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }

  .question-item {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 1rem;
    cursor: grab;
    transition: all 0.2s;
  }

  .question-item:hover { background: rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.3); }

  .q-num {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
  }

  .q-text { flex: 1; font-weight: 600; font-size: 0.95rem; }

  .q-meta { display: flex; gap: 0.5rem; }

  .tag {
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em;
    border-radius: 100px; padding: 0.2rem 0.6rem;
  }

  .tag-easy { background: rgba(16,185,129,0.15); color: #10b981; }
  .tag-medium { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .tag-hard { background: rgba(239,68,68,0.15); color: #ef4444; }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    animation: fadeIn 0.2s;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 2rem;
    width: 100%; max-width: 500px;
    animation: modalSlide 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes modalSlide {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-title {
    font-family: 'Righteous', cursive;
    font-size: 1.4rem; margin-bottom: 1.5rem;
    color: var(--text);
  }

  .form-group { margin-bottom: 1rem; }
  .form-label { font-size: 0.8rem; font-weight: 800; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; text-transform: uppercase; }

  textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 0.875rem;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem; font-weight: 600;
    color: var(--text);
    outline: none;
    resize: none;

  textarea:focus { border-color: var(--accent2); }

  select {
    width: 100%;
    background: rgba(255,255,255,0.05);

  }

  select option { background: #1a1a35; }

  .ai-badge {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(6,182,212,0.2));
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 100px;
    padding: 0.35rem 0.75rem;
    font-size: 0.8rem; font-weight: 800;
    color: #a78bfa;
    margin-bottom: 1rem;

  }

  .ai-badge:hover { background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(6,182,212,0.3)); }

  .ai-spinner {
    width: 12px; height: 12px;
    border: 2px solid rgba(124,58,237,0.3);
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .notification {
    position: fixed; top: 1rem; right: 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.875rem 1.25rem;

    z-index: 2000;
    animation: notifSlide 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

  }

  @keyframes notifSlide {
    from { opacity: 0; transform: translateX(50px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .notif-icon { font-size: 1.2rem; }

  .progress-bar {
    width: 100%; max-width: 700px;
    height: 6px;
    background: rgba(255,255,255,0.08);

  .sound-toggle {

<body>

<script>
// ===== STATE =====
const state = {
  screen: 'landing',
  soundOn: true,
  playerName: 'You',
  players: [],
  questions: [],
  currentQ: 0,
  score: 0,
  streak: 0,
  answered: false,
  timerValue: 20,
  timerInterval: null,
  leaderboard: [],
  builtQuestions: [],
  audioCtx: null,
};

const EMOJIS = ['🦊','🐼','🦁','🐯','🦄','🐻','🦋','🐸','🦅','🦊','🐮','🐺'];
const COLORS = ['#7c3aed','#0891b2','#d97706','#dc2626','#059669','#db2777','#7c3aed','#0891b2'];

const DEMO_QUESTIONS = [
  { q: "What is the capital of Japan?", opts: ["Beijing","Tokyo","Seoul","Bangkok"], correct: 1, diff: "easy" },
  { q: "Which planet is known as the Red Planet?", opts: ["Venus","Jupiter","Mars","Saturn"], correct: 2, diff: "easy" },
  { q: "Who painted the Mona Lisa?", opts: ["Van Gogh","Picasso","Da Vinci","Michelangelo"], correct: 2, diff: "medium" },
  { q: "What is 7 × 8?", opts: ["54","56","62","48"], correct: 1, diff: "easy" },
  { q: "Which element has the chemical symbol 'Au'?", opts: ["Silver","Aluminum","Gold","Copper"], correct: 2, diff: "medium" },
  { q: "In which year did World War II end?", opts: ["1943","1944","1945","1946"], correct: 2, diff: "medium" },
  { q: "What is the largest ocean on Earth?", opts: ["Atlantic","Indian","Arctic","Pacific"], correct: 3, diff: "easy" },
  { q: "Which programming language was created by Guido van Rossum?", opts: ["Java","Python","Ruby","C++"], correct: 1, diff: "hard" },
];

const DEMO_PLAYERS = [
  { name: "Alex", emoji: "🦊", color: "#7c3aed" },
  { name: "Jamie", emoji: "🐼", color: "#0891b2" },
  { name: "Sam", emoji: "🦁", color: "#d97706" },
  { name: "Quinn", emoji: "🐯", color: "#dc2626" },
  { name: "Jordan", emoji: "🦄", color: "#059669" },
];

// ===== AUDIO ENGINE =====
function getAudioCtx() {
  if (!state.audioCtx) {
    try { state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return state.audioCtx;
}

function playTone(freq, type = 'sine', duration = 0.15, vol = 0.3, delay = 0) {
  if (!state.soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    osc.type = type;
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

function playCorrectSound() {
  playTone(523, 'sine', 0.1, 0.4);
  playTone(659, 'sine', 0.1, 0.4, 0.1);
  playTone(784, 'sine', 0.15, 0.4, 0.2);
  playTone(1047, 'sine', 0.2, 0.3, 0.3);
}

function playWrongSound() {
  playTone(200, 'sawtooth', 0.15, 0.3);
  playTone(150, 'sawtooth', 0.2, 0.3, 0.15);
}

function playClickSound() {
  playTone(800, 'sine', 0.05, 0.15);
}

function playTickSound() {
  playTone(1000, 'square', 0.03, 0.1);
}

function playStreakSound() {
  [440, 550, 660, 880].forEach((f, i) => playTone(f, 'sine', 0.12, 0.35, i * 0.08));
}

function playVictorySound() {
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((f, i) => playTone(f, 'sine', 0.15, 0.3, i * 0.12));
}

function playCountdownSound(n) {
  playTone(n === 1 ? 880 : 660, 'sine', 0.08, 0.4);
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById('sound-btn').textContent = state.soundOn ? '🔊' : '🔇';
  showNotif(state.soundOn ? '🔊 Sound on' : '🔇 Sound muted', '');
}

// ===== PARTICLES =====
(function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx2d = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    const count = Math.min(60, Math.floor(W / 20));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.4 + 0.1,
        color: ['#7c3aed','#06b6d4','#f59e0b'][Math.floor(Math.random() * 3)]
      });
    }
  }

  function draw() {
    ctx2d.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx2d.fillStyle = p.color;
      ctx2d.globalAlpha = p.alpha;
      ctx2d.fill();
      ctx2d.globalAlpha = 1;
    });
    requestAnimationFrame(draw);
  }

  resize();
  createParticles();
  draw();
  window.addEventListener('resize', () => { resize(); createParticles(); });
})();

// ===== SCREEN MANAGEMENT =====
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name === 'podium' ? 'podium-screen' : name).classList.add('active');
  state.screen = name;
  playClickSound();
}

// ===== NOTIFICATIONS =====
function showNotif(text, icon = '✅') {
  const el = document.createElement('div');
  el.className = 'notification';
  el.innerHTML = `<span class="notif-icon">${icon}</span><span>${text}</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ===== LANDING =====
function joinRoom() {
  const code = document.getElementById('room-code-input').value.trim();
  const name = document.getElementById('player-name-input').value.trim();
  if (!code) { showNotif('Enter a room code!', '⚠️'); return; }
  if (!name) { showNotif('Enter your name!', '⚠️'); return; }
  state.playerName = name;
  setupLobby(code.toUpperCase(), false);
}

function hostDemo() {
  state.playerName = 'Host';
  setupLobby('QBLTZ', true);
}

// ===== LOBBY =====
function setupLobby(code, isHost) {
  document.getElementById('room-code-label').textContent = code;
  document.getElementById('quiz-name-label').textContent = 'General Knowledge Blitz';
  document.getElementById('host-controls').style.display = isHost ? 'flex' : 'none';
  document.getElementById('waiting-msg').style.display = isHost ? 'none' : 'flex';

  state.players = [{ name: state.playerName, emoji: EMOJIS[0], color: COLORS[0], score: 0, streak: 0, isMe: true }];
  if (isHost) {
    DEMO_PLAYERS.forEach((p, i) => {
      setTimeout(() => {
        state.players.push({ ...p, score: 0, streak: 0, isMe: false });
        renderPlayers();
        document.getElementById('player-count-label').textContent = `${state.players.length} / 10 players`;
        showNotif(`${p.name} joined! ${p.emoji}`, p.emoji);
      }, (i + 1) * 800);
    });
  }

  state.questions = DEMO_QUESTIONS;
  state.currentQ = 0;
  state.score = 0;
  state.streak = 0;
  renderPlayers();
  showScreen('lobby');
}

function renderPlayers() {
  const grid = document.getElementById('players-grid');
  grid.innerHTML = '';
  state.players.forEach(p => {
    const el = document.createElement('div');
    el.className = 'player-chip';
    el.innerHTML = `
      <div class="player-avatar" style="background: ${p.color}22; border: 2px solid ${p.color}44;">
        ${p.emoji}
      </div>
      <div class="player-name-chip">${p.name}${p.isMe ? ' (You)' : ''}</div>
    `;
    grid.appendChild(el);
  });
}

function addBots() {
  const bots = [
    { name: "QuizBot", emoji: "🤖", color: "#7c3aed" },
    { name: "AIPlayer", emoji: "💡", color: "#06b6d4" },
  ];
  bots.forEach((b, i) => {
    setTimeout(() => {
      if (state.players.length < 10) {
        state.players.push({ ...b, score: 0, streak: 0, isMe: false });
        renderPlayers();
        document.getElementById('player-count-label').textContent = `${state.players.length} / 10 players`;
        showNotif(`${b.name} joined! ${b.emoji}`, b.emoji);
      }
    }, i * 500);
  });
}

// ===== GAME ENGINE =====
function startGame() {
  state.currentQ = 0;
  state.score = 0;
  state.streak = 0;
  state.players.forEach(p => { p.score = Math.floor(Math.random() * 200); p.streak = 0; });
  state.players.find(p => p.isMe).score = 0;
  showQuestion();
}

function showQuestion() {
  if (state.currentQ >= state.questions.length) {
    showFinalLeaderboard();
    return;
  }

  state.answered = false;
  const q = state.questions[state.currentQ];

  document.getElementById('q-counter').textContent = `QUESTION ${state.currentQ + 1} OF ${state.questions.length}`;
  document.getElementById('score-label').textContent = `⚡ ${state.score} pts`;
  document.getElementById('progress-fill').style.width = `${((state.currentQ) / state.questions.length) * 100}%`;

  const qEl = document.getElementById('question-text');
  qEl.style.animation = 'none';
  qEl.offsetHeight;
  qEl.style.animation = '';
  qEl.textContent = q.q;

  const grid = document.getElementById('answers-grid');
  grid.innerHTML = '';
  const classes = ['a','b','c','d'];
  const icons = ['A','B','C','D'];

  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = `answer-btn ${classes[i]}`;
    btn.innerHTML = `<div class="answer-icon">${icons[i]}</div><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i, q.correct, btn);
    grid.appendChild(btn);
  });

  showScreen('game');
  startTimer(20, q.correct);
}

function startTimer(seconds, correctIdx) {
  clearInterval(state.timerInterval);
  state.timerValue = seconds;

  const circle = document.getElementById('timer-circle');
  const numEl = document.getElementById('timer-num');
  const circumference = 220;

  function update() {
    const progress = state.timerValue / seconds;
    const offset = circumference * (1 - progress);
    circle.style.strokeDashoffset = offset;

    const hue = progress > 0.4 ? 270 : progress > 0.2 ? 40 : 0;
    const color = `hsl(${hue}, 90%, 60%)`;
    circle.style.stroke = color;
    numEl.style.color = state.timerValue <= 5 ? '#ef4444' : 'var(--text)';

    if (state.timerValue <= 5) {
      numEl.style.animation = 'none';
      numEl.offsetHeight;
      numEl.style.animation = 'correctPop 0.3s ease';
      playCountdownSound(state.timerValue);
    }

    numEl.textContent = state.timerValue;
    state.timerValue--;

    if (state.timerValue < 0) {
      clearInterval(state.timerInterval);
      if (!state.answered) timeOut(correctIdx);
    }
  }

  update();
  state.timerInterval = setInterval(update, 1000);
}

function selectAnswer(idx, correctIdx, btn) {
  if (state.answered) return;
  state.answered = true;
  clearInterval(state.timerInterval);

  const timeBonus = state.timerValue;
  const allBtns = document.querySelectorAll('.answer-btn');

  allBtns.forEach(b => b.disabled = true);

  if (idx === correctIdx) {
    btn.classList.add('correct');
    const points = 100 + (timeBonus * 10);
    state.score += points;
    state.streak++;
    playCorrectSound();

    showScorePopup(`+${points}`);

    if (state.streak >= 3) {
      playStreakSound();
      showStreakBadge(`🔥 ${state.streak}x STREAK!`);
    }

    allBtns.forEach((b, i) => { if (i !== idx) b.classList.add('wrong'); });
  } else {
    btn.style.background = 'rgba(239,68,68,0.3)';
    btn.style.border = '2px solid rgba(239,68,68,0.6)';
    allBtns[correctIdx].classList.add('correct');
    state.streak = 0;
    playWrongSound();
    allBtns.forEach((b, i) => { if (i !== idx && i !== correctIdx) b.classList.add('wrong'); });
  }

  simulateBotAnswers();
  setTimeout(showLeaderboard, 1500);
}

function timeOut(correctIdx) {
  state.answered = true;
  state.streak = 0;
  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);
  allBtns[correctIdx].classList.add('correct');
  allBtns.forEach((b, i) => { if (i !== correctIdx) b.classList.add('wrong'); });
  playWrongSound();
  simulateBotAnswers();
  setTimeout(showLeaderboard, 1500);
}

function simulateBotAnswers() {
  state.players.forEach(p => {
    if (!p.isMe) {
      const correct = Math.random() > 0.35;
      p.score += correct ? Math.floor(Math.random() * 200) + 80 : 0;
      if (correct) p.streak = (p.streak || 0) + 1;
      else p.streak = 0;
    }
  });
}

function showScorePopup(text) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function showStreakBadge(text) {
  const el = document.createElement('div');
  el.className = 'streak-badge';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function sendEmoji(emoji) {
  const el = document.createElement('div');
  el.className = 'emoji-reaction';
  el.textContent = emoji;
  el.style.left = `${30 + Math.random() * 40}%`;
  el.style.bottom = '20%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
  playClickSound();
}

function showLeaderboard() {
  const sorted = [...state.players].sort((a, b) => b.score - a.score);
  state.leaderboard = sorted;

  const q = state.questions[state.currentQ];
  document.getElementById('correct-display').textContent =
    `✓ Correct: ${q.opts[q.correct]}`;

  const fastestEl = document.getElementById('fastest-display');
  fastestEl.innerHTML = `<span class="fastest-badge">⚡ Fastest Answer</span>`;

  const list = document.getElementById('lb-list');
  list.innerHTML = '';

  sorted.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = `lb-row rank-${i + 1}${p.isMe ? ' me' : ''}`;
    row.style.animationDelay = `${i * 0.07}s`;

    const medals = ['🥇','🥈','🥉'];
    const rankDisplay = i < 3 ? medals[i] : `#${i + 1}`;

    row.innerHTML = `
      <div class="lb-rank">${rankDisplay}</div>
      <div style="font-size: 1.3rem;">${p.emoji}</div>
      <div style="flex: 1;">
        <div style="font-weight: 700; font-size: 0.95rem;">${p.name}${p.isMe ? ' <span style="color: #a78bfa; font-size: 0.75rem;">(You)</span>' : ''}</div>
        ${p.streak >= 2 ? `<div class="lb-streak">🔥 ${p.streak}x streak</div>` : ''}
      </div>
      <div class="lb-score">${p.score.toLocaleString()}</div>
    `;
    list.appendChild(row);
  });

  const isLast = state.currentQ >= state.questions.length - 1;
  document.getElementById('next-btn').textContent = isLast ? '🏆 See Final Results' : 'Next Question →';
  showScreen('leaderboard');
}

function nextQuestion() {
  playClickSound();
  state.currentQ++;
  if (state.currentQ >= state.questions.length) {
    showFinalLeaderboard();
  } else {
    showQuestion();
  }
}

function showFinalLeaderboard() {
  showPodium();
}

function showPodium() {
  const sorted = [...state.players].sort((a, b) => b.score - a.score);
  const top3 = sorted.slice(0, 3);

  const winner = top3[0];
  document.getElementById('winner-msg').textContent =
    `${winner.emoji} ${winner.name} wins with ${winner.score.toLocaleString()} points!`;

  const container = document.getElementById('podium-container');
  container.innerHTML = '';

  const order = top3.length >= 2 ? [
    top3[1], top3[0], top3.length >= 3 ? top3[2] : null
  ] : [null, top3[0], null];

  const positions = [2, 1, 3];

  order.forEach((player, i) => {
    if (!player) return;
    const place = positions[i];
    const div = document.createElement('div');
    div.className = `podium-place p${place}`;
    div.innerHTML = `
      ${place === 1 ? '<div class="crown">👑</div>' : ''}
      <div class="podium-avatar-big">${player.emoji}</div>
      <div class="podium-player-name">${player.name}</div>
      <div class="podium-player-score">⚡ ${player.score.toLocaleString()}</div>
      <div class="podium-block">${place === 1 ? '🥇' : place === 2 ? '🥈' : '🥉'}</div>
    `;
    container.appendChild(div);
  });

  showScreen('podium');
  playVictorySound();
  setTimeout(launchConfetti, 500);
  setTimeout(launchConfetti, 1000);
  setTimeout(launchConfetti, 1500);
}

function launchConfetti() {
  const colors = ['#7c3aed','#06b6d4','#f59e0b','#ef4444','#10b981','#ec4899'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        width: ${Math.random() * 10 + 5}px;
        height: ${Math.random() * 10 + 5}px;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
        animation-duration: ${Math.random() * 2 + 2}s;
        animation-delay: ${Math.random() * 0.5}s;
        transform: rotate(${Math.random() * 360}deg);
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i * 40);
  }
}

function playAgain() {
  startGame();
}

// ===== QUIZ BUILDER =====
state.builtQuestions = [
  { q: "What year was the Eiffel Tower built?", opts: ["1887","1889","1892","1901"], correct: 1, diff: "medium" },
  { q: "Who wrote 'Romeo and Juliet'?", opts: ["Dickens","Austen","Shakespeare","Tolkien"], correct: 2, diff: "easy" },
  { q: "What is the speed of light?", opts: ["200,000 km/s","300,000 km/s","400,000 km/s","500,000 km/s"], correct: 1, diff: "hard" },
];

function renderBuilderQuestions() {
  const list = document.getElementById('question-list');
  list.innerHTML = '';
  state.builtQuestions.forEach((q, i) => {
    const el = document.createElement('div');
    el.className = 'question-item';
    el.innerHTML = `
      <div class="q-num">${i + 1}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-meta">
        <div class="tag tag-${q.diff}">${q.diff}</div>
      </div>
      <button onclick="removeQuestion(${i})" style="background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0.25rem;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--muted)'">✕</button>
    `;
    list.appendChild(el);
  });
}

function removeQuestion(i) {
  state.builtQuestions.splice(i, 1);
  renderBuilderQuestions();
  playClickSound();
}

function openAddQuestion() {
  document.getElementById('question-modal').style.display = 'flex';
  playClickSound();
}

function closeModal() {
  document.getElementById('question-modal').style.display = 'none';
}

function addQuestion() {
  const q = document.getElementById('new-question').value.trim();
  const a = document.getElementById('ans-a').value.trim();
  const b = document.getElementById('ans-b').value.trim();
  const c = document.getElementById('ans-c').value.trim();
  const d = document.getElementById('ans-d').value.trim();
  const correct = parseInt(document.getElementById('correct-answer').value);
  const diff = document.getElementById('difficulty').value;

  if (!q || !a || !b) { showNotif('Fill in question and at least 2 options!', '⚠️'); return; }

  state.builtQuestions.push({ q, opts: [a, b || 'N/A', c || 'N/A', d || 'N/A'], correct, diff });
  renderBuilderQuestions();
  closeModal();
  showNotif('Question added!', '✅');

  document.getElementById('new-question').value = '';
  document.getElementById('ans-a').value = '';
  document.getElementById('ans-b').value = '';
  document.getElementById('ans-c').value = '';
  document.getElementById('ans-d').value = '';
}

async function generateAIQuestions() {
  const topic = document.getElementById('quiz-title-input').value.trim() || 'General Knowledge';
  const btn = document.getElementById('ai-gen-btn');
  const spinner = document.getElementById('ai-spinner');
  const btnText = document.getElementById('ai-btn-text');

  spinner.style.display = 'block';
  btnText.textContent = 'Generating...';
  btn.style.pointerEvents = 'none';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Generate 3 quiz questions about "${topic}". Return ONLY a JSON array with no markdown, no backticks. Each item: {"q": "question text", "opts": ["A","B","C","D"], "correct": 0, "diff": "easy|medium|hard"}. Correct is the 0-based index of the right answer.`
        }]
      })
    });

    const data = await response.json();
    let text = data.content?.[0]?.text || '[]';
    text = text.replace(/```json|```/g, '').trim();
    const questions = JSON.parse(text);

    if (Array.isArray(questions) && questions.length > 0) {
      questions.forEach(q => state.builtQuestions.push(q));
      renderBuilderQuestions();
      showNotif(`${questions.length} questions generated! 🤖`, '✨');
    }
  } catch(e) {
    const fallback = [
      { q: `What is the primary focus of ${topic}?`, opts: ["Option A","Option B","Option C","Option D"], correct: 0, diff: "medium" },
      { q: `Which term is most associated with ${topic}?`, opts: ["Term A","Term B","Term C","Term D"], correct: 1, diff: "easy" },
    ];
    fallback.forEach(q => state.builtQuestions.push(q));
    renderBuilderQuestions();
    showNotif('Generated sample questions!', '✨');
  }

  spinner.style.display = 'none';
  btnText.textContent = '✨ AI Generate Questions';
  btn.style.pointerEvents = 'auto';
}

function saveAndHost() {
  if (state.builtQuestions.length < 2) {
    showNotif('Add at least 2 questions!', '⚠️'); return;
  }
  const title = document.getElementById('quiz-title-input').value.trim() || 'My Quiz';
  state.questions = [...state.builtQuestions];
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  state.playerName = 'Host';
  setupLobby(code, true);
  document.getElementById('quiz-name-label').textContent = title;
  showNotif('Quiz saved! Share the room code.', '🚀');
}

// Init builder
window.addEventListener('load', () => {
  renderBuilderQuestions();
});
