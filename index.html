<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizVerse</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
}
.card{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
text-align:center;
max-width:700px;
box-shadow:0 0 40px rgba(124,77,255,.4);
}
h1{
font-size:64px;
margin:0 0 10px;
background:linear-gradient(90deg,#7c4dff,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
p{
font-size:20px;
line-height:1.6;
color:#cbd5e1;
}
button{
padding:14px 28px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#7c4dff,#00d4ff);
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
margin-top:20px;
}
</style>
</head>
<body>
<div class="card">
<h1>QuizVerse</h1>
<p>Realtime Multiplayer Quiz Platform — GitHub + Vercel Ready Single HTML File.</p>
<button onclick="alert('Platform Ready 🚀')">Launch Demo</button>
</div>
</body>
</html>
